<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f5ef">
  <title>{% if page.title %}{{ page.title | escape }}{% else %}{{ site.title | escape }}{% endif %}</title>
  <meta name="description" content="{{ site.description | escape }}">
  <link rel="preload" href="{{ '/fonts/manrope-latin.woff2' | relative_url }}" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="{{ '/css/main.css' | relative_url }}">
  {% if site.url %}<link rel="canonical" href="{{ page.url | absolute_url }}">{% endif %}
  <link rel="icon" type="image/png" href="{{ '/favicon.png' | relative_url }}">
  <script src="{{ '/assets/js/resume.js' | relative_url }}" defer></script>
</head>
